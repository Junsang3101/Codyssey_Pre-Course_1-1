services:
  web:
    build: .
    container_name: ubuntu-web-test
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./proxy/default.conf:/etc/nginx/sites-enabled/default:ro
    depends_on:
      - app

  app:
    build: ./app
    expose: 
      - "5000"
    depends_on:
      - redis
  
  # redis 기본 포트: 6379
  redis:
    image: redis
    volumes:
      - redis-data:/data

volumes:
  redis-data: